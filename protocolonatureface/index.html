<!-- Janela do formulário de inscrição -->
<div class="modal" id="modal-inscricao" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" hidden>
  <div class="modal-fundo" data-fecha-modal></div>
  <div class="modal-painel" role="document">
    <button class="modal-x" type="button" aria-label="Fechar formulário" data-fecha-modal>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
    </button>
    <p class="rotulo" data-c="rotulos.formulario"></p>
    <h2 class="modal-titulo" id="modal-titulo" data-c="formulario.titulo"></h2>
    <p class="modal-texto" data-c="formulario.texto"></p>
    <form class="form" id="form-interesse" novalidate>
      <div class="campo-form largo">
        <label for="f-nome">Nome completo</label>
        <input id="f-nome" name="nome" type="text" maxlength="80" autocomplete="name" required>
      </div>
      <div class="campo-form">
        <label for="f-whats">WhatsApp</label>
        <input id="f-whats" name="whatsapp" type="tel" maxlength="20" pattern="[0-9\(\)\+\-\s]{10,20}" inputmode="tel" autocomplete="tel" placeholder="(11) 99999-9999" required>
      </div>
      <div class="campo-form">
        <label for="f-email">E-mail</label>
        <input id="f-email" name="email" type="email" maxlength="100" autocomplete="email" required>
      </div>
      <div class="campo-form">
        <label for="f-cidade">Cidade / Estado</label>
        <input id="f-cidade" name="cidade" type="text" maxlength="60" autocomplete="address-level2" required>
      </div>
      <div class="campo-form">
        <label for="f-prof">Profissão</label>
        <select id="f-prof" name="profissao" required data-lista="formulario.profissoes"></select>
      </div>
      <div class="campo-form">
        <label for="f-turma">Qual turma te interessa?</label>
        <select id="f-turma" name="turma" data-lista="formulario.turmas"></select>
      </div>
      <fieldset class="campo-form largo">
        <legend>Já atua com procedimentos faciais?</legend>
        <div class="opcoes">
          <label><input type="radio" name="experiencia" value="sim" required> Sim</label>
          <label><input type="radio" name="experiencia" value="nao"> Não</label>
          <label><input type="radio" name="experiencia" value="comecando"> Estou começando</label>
        </div>
      </fieldset>
      <label class="consentimento largo">
        <input type="checkbox" name="consentimento" required>
        <span>Aceito receber contato da equipe NatureFace e concordo com a <a class="js-privacidade" href="#">Política de Privacidade</a>.</span>
      </label>
      <p class="form-erro largo" role="alert" hidden>Confira os campos destacados.</p>
      <button class="btn btn-ouro largo" type="submit" data-c="formulario.botao"></button>
      <p class="form-ok largo" role="status" hidden data-c="formulario.mensagemEnviado"></p>
    </form>
  </div>
</div>
